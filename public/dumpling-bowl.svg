<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="32" height="32" role="img" aria-hidden="true">
  <title>Dumping bowl icon</title>
  <defs>
    <linearGradient id="g-bowl" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#F6FAFF"/>
      <stop offset="100%" stop-color="#E6F0FF"/>
    </linearGradient>
    <linearGradient id="g-dumpling" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#FFD57A"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- bowl -->
  <g transform="translate(16,120)">
    <ellipse cx="112" cy="64" rx="112" ry="48" fill="url(#g-bowl)" stroke="#C7DDFF" stroke-width="4"/>
    <path d="M0 64 C32 110, 192 110, 224 64 L224 82 C192 120, 32 120, 0 82 Z" fill="#F9FBFF" opacity="0.6"/>
  </g>

  <!-- dumplings -->
  <g filter="url(#s)">
    <g transform="translate(24,88)">
      <ellipse cx="64" cy="56" rx="44" ry="28" fill="url(#g-dumpling)" stroke="#EAA83A" stroke-width="2"/>
      <ellipse cx="128" cy="52" rx="46" ry="30" fill="url(#g-dumpling)" stroke="#EAA83A" stroke-width="2"/>
      <ellipse cx="96" cy="36" rx="42" ry="26" fill="url(#g-dumpling)" stroke="#EAA83A" stroke-width="2"/>
      <!-- highlights -->
      <path d="M40 46 C44 40, 60 36, 72 40" stroke="#FFF7E6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M108 40 C116 34, 132 32, 148 38" stroke="#FFF7E6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
      <path d="M84 28 C92 22, 108 20, 120 26" stroke="#FFF7E6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
    </g>
  </g>

  <!-- steam -->
  <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" fill="none" transform="translate(32,22)">
    <path d="M40 40 C36 24, 48 12, 40 0" opacity="0.7"/>
    <path d="M72 44 C68 30, 80 18, 72 6" opacity="0.55"/>
  </g>

  <!-- chopsticks -->
  <g transform="translate(20,20) rotate(-18 120 40)">
    <rect x="28" y="8" width="160" height="8" rx="4" fill="#6B432A" opacity="0.95"/>
    <rect x="28" y="20" width="142" height="6" rx="3" fill="#A77552" opacity="0.9"/>
  </g>
</svg>